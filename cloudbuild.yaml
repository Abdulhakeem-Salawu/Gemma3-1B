# App image, built on top of the prebuilt llama-cpp-python base image
# (see Dockerfile.base). Fast: no compile step.
#   gcloud builds submit https://github.com/Abdulhakeem-Salawu/Gemma3-1B \
#     --git-source-revision=main --region=us-central1 --config=cloudbuild.yaml
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '$_IMAGE', '.']
images: ['$_IMAGE']
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/pioneering-axe-233302/cloud-run-source-deploy/gemma-agent
