<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Terminal</title>
<style>
  :root {
    --bg: #0b0e0a;
    --panel: #10140f;
    --line: #1e2a1a;
    --amber: #ffb300;
    --green: #7ee787;
    --dim: #5c6b58;
    --text: #d9e3d0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--dim);
    letter-spacing: 0.02em;
  }
  header .spacer { flex: 1; }
  header button.link {
    background: none;
    color: var(--dim);
    border: 1px solid var(--line);
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 400;
    border-radius: 3px;
  }
  header button.link:hover { color: var(--text); border-color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.off { background: #5a2323; box-shadow: none; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px 8px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { margin-bottom: 18px; line-height: 1.55; white-space: pre-wrap; }
  .msg .role { color: var(--dim); font-size: 12px; display: block; margin-bottom: 4px; }
  .msg.user .role { color: var(--amber); }
  .msg.assistant .role { color: var(--green); }
  .msg.tool { color: var(--dim); font-size: 13px; border-left: 2px solid var(--line); padding-left: 10px; }
  .msg.thinking {
    color: var(--dim);
    font-size: 13px;
    font-style: italic;
    border-left: 2px dashed var(--line);
    padding-left: 10px;
  }
  .msg.thinking .role { color: var(--dim); }

  /* Composer: the whole bottom compose bar (attached documents + input),
     visually separated from the scrolling log by its own top border — the
     doc chips live here now, right above the textarea, instead of floating
     at the top of the page. */
  .composer {
    border-top: 1px solid var(--line);
    background: var(--bg);
  }

  .docs {
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 10px 18px 0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--dim);
  }
  .docs.empty { display: none; }
  .chip {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 3px 10px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .chip .n { color: var(--green); }
  .docs-actions { margin-left: auto; display: flex; gap: 8px; }
  .docs-actions button.link {
    background: none;
    border: 1px solid var(--line);
    color: var(--dim);
    padding: 3px 8px;
    font-size: 12px;
    border-radius: 3px;
  }
  .docs-actions button.link:hover { color: var(--text); }
  .docs-status { font-size: 12px; color: var(--dim); padding: 4px 18px 0; max-width: 760px; margin: 0 auto; width: 100%; }

  form {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 14px 18px 20px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font: inherit;
    padding: 10px 12px;
    border-radius: 4px;
  }
  textarea:focus { outline: none; border-color: var(--amber); }
  button {
    background: var(--amber);
    color: #1a1200;
    border: none;
    padding: 0 18px;
    height: 38px;
    border-radius: 4px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  button.upload {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    font-weight: 400;
    padding: 0 14px;
  }
  button.upload:hover { border-color: var(--amber); }
  input[type=file] { display: none; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span><span id="status">ready</span>
  <span class="spacer"></span>
  <button class="link" id="newChatBtn" type="button">New chat</button>
</header>
<main id="log"></main>
<div class="composer">
  <div class="docs empty" id="docsPanel">
    <span>docs:</span>
    <span id="docsChips"></span>
    <span class="docs-actions"><button class="link" id="clearDocsBtn" type="button">clear docs</button></span>
  </div>
  <div class="docs-status" id="docsStatus"></div>
  <form id="form">
    <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md" />
    <button class="upload" id="uploadBtn" type="button" title="Attach a PDF, DOCX, TXT or MD file for the model to use as context">+ doc</button>
    <textarea id="input" rows="1" placeholder="Ask something…"></textarea>
    <button id="send">Send</button>
  </form>
</div>
<script>
const API_KEY = localStorage.getItem("agent_api_key") || prompt("API key for this agent (leave blank if none set):") || "";
localStorage.setItem("agent_api_key", API_KEY);

// A session id ties uploaded documents to this browser's conversation. It is
// generated once and kept in localStorage so a reload keeps the same
// documents available (as long as the server process hasn't restarted —
// see checkInstance() below, which detects that and says so).
const SESSION_KEY = "agent_session_id";
function newSessionId() {
  return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
}
let sessionId = localStorage.getItem(SESSION_KEY);
if (!sessionId) {
  sessionId = newSessionId();
  localStorage.setItem(SESSION_KEY, sessionId);
}

const HISTORY_KEY = "agent_history";
const DOCS_KEY = "agent_docs";
const INSTANCE_KEY = "agent_instance_id";

const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const dot = document.getElementById("dot");
const status = document.getElementById("status");
const newChatBtn = document.getElementById("newChatBtn");
const fileInput = document.getElementById("fileInput");
const uploadBtn = document.getElementById("uploadBtn");
const docsPanel = document.getElementById("docsPanel");
const docsChips = document.getElementById("docsChips");
const docsStatus = document.getElementById("docsStatus");
const clearDocsBtn = document.getElementById("clearDocsBtn");

// history is exactly what gets sent to the model as conversation so far —
// only real user/assistant turns, never "thinking" scratch text or tool
// traces (those are per-turn UI feedback, not part of the conversation the
// model should be replayed).
let history = [];
let uploadedDocs = [];  // [{name, chunks}] — display only, mirrors what the server has for this session
let busy = false;

function loadState() {
  try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); } catch (e) { history = []; }
  try { uploadedDocs = JSON.parse(localStorage.getItem(DOCS_KEY) || "[]"); } catch (e) { uploadedDocs = []; }
}
function saveHistory() { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
function saveDocs() { localStorage.setItem(DOCS_KEY, JSON.stringify(uploadedDocs)); }

function renderDocs() {
  docsChips.innerHTML = "";
  if (!uploadedDocs.length) {
    docsPanel.classList.add("empty");
    return;
  }
  docsPanel.classList.remove("empty");
  for (const d of uploadedDocs) {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `${d.name} <span class="n">${d.chunks}</span>`;
    docsChips.appendChild(chip);
  }
}

// Returns the message element and its text node, so a streaming reply can
// keep appending to the same node instead of re-rendering the message.
function addMessage(role, content) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  const label = document.createElement("span");
  label.className = "role";
  label.textContent = role === "thinking" ? "thinking" : role;
  div.appendChild(label);
  const node = document.createTextNode(content);
  div.appendChild(node);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return { div, node };
}

// Persists a not-yet-finished assistant reply so a reload mid-stream keeps
// what arrived so far instead of losing the exchange. Throttled — streaming
// can emit many small pieces per second and localStorage writes are sync.
let lastPartialSave = 0;
function savePartialAssistant(text) {
  const now = Date.now();
  if (now - lastPartialSave < 400) return;
  lastPartialSave = now;
  const snapshot = history.concat([{ role: "assistant", content: text, partial: true }]);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(snapshot));
}

function renderHistory() {
  let interrupted = false;
  history.forEach((m, i) => {
    const isLast = i === history.length - 1;
    if (m.partial && isLast) interrupted = true;
    addMessage(m.role, m.content);
  });
  if (interrupted) {
    const last = history[history.length - 1];
    addMessage("tool", "[the reply above was cut off by a reload]");
    delete last.partial;
    saveHistory();
  }
}

// The server keeps uploaded documents in memory only — a restart (scale to
// zero after being idle, a crash, a new deploy) loses them even though this
// page's chat history and doc list survive in localStorage. instance_id
// changes every time the server process starts, so comparing it tells us.
async function checkInstance() {
  try {
    const res = await fetch("/session/init");
    const data = await res.json();
    const lastSeen = localStorage.getItem(INSTANCE_KEY);
    if (lastSeen && lastSeen !== data.instance_id && uploadedDocs.length) {
      uploadedDocs = [];
      saveDocs();
      renderDocs();
      addMessage("tool", "[notice] The agent restarted since your last visit, which cleared its uploaded documents (chat history is unaffected). Re-upload anything you still need.");
    }
    localStorage.setItem(INSTANCE_KEY, data.instance_id);
  } catch (e) {
    // non-fatal — skip the check silently rather than blocking the page
  }
}

async function uploadFile(file) {
  uploadBtn.disabled = true;
  docsStatus.textContent = `uploading ${file.name}…`;
  try {
    const form = new FormData();
    form.append("file", file);
    const res = await fetch(`/kb/upload?session_id=${encodeURIComponent(sessionId)}`, {
      method: "POST",
      headers: { "x-api-key": API_KEY },
      body: form,
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.detail || `Upload failed (${res.status})`);
    uploadedDocs.push({ name: body.filename, chunks: body.total_chunks });
    saveDocs();
    renderDocs();
    docsStatus.textContent = `${file.name}: added ${body.chunks_added} chunk(s)`;
  } catch (err) {
    docsStatus.textContent = `${file.name}: ${err.message}`;
  } finally {
    uploadBtn.disabled = false;
  }
}

async function clearDocs() {
  docsStatus.textContent = "clearing…";
  try {
    await fetch("/kb/clear", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": API_KEY },
      body: JSON.stringify({ session_id: sessionId }),
    });
  } catch (e) { /* best effort — clear the client list regardless */ }
  uploadedDocs = [];
  saveDocs();
  renderDocs();
  docsStatus.textContent = "";
}

function resetChat() {
  if (history.length && !confirm("Start a new chat? This clears the visible conversation and uploaded documents.")) return;
  history = [];
  saveHistory();
  log.innerHTML = "";
  clearDocs();
  sessionId = newSessionId();
  localStorage.setItem(SESSION_KEY, sessionId);
  status.textContent = "ready";
}

async function send(text) {
  if (busy) return;               // never overlap requests: the server handles one at a time
  busy = true;
  history.push({ role: "user", content: text });
  saveHistory();                  // persist the question immediately, before any reply arrives
  addMessage("user", text);
  input.value = "";
  sendBtn.disabled = true;
  status.textContent = "thinking… (the first reply after a quiet spell can take a minute or two)";

  let thinkingBubble = null;      // reasoning text; a fresh bubble per model turn (tool calls can mean several)
  let bubble = null;              // assistant message, created when the first answer token arrives
  let reply = "";

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": API_KEY },
      body: JSON.stringify({ messages: history, session_id: sessionId }),
    });
    if (!res.ok) {
      const body = await res.text();
      throw new Error(res.status === 429
        ? "The model is busy or still waking up. Wait a few seconds and resend."
        : res.status === 401 ? "Wrong password." : body);
    }

    // Server-sent events: frames look like `data: {...}` separated by a blank line.
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let finished = false;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let end;
      while ((end = buffer.indexOf("\n\n")) !== -1) {
        const frame = buffer.slice(0, end);
        buffer = buffer.slice(end + 2);
        if (!frame.startsWith("data: ")) continue;
        const evt = JSON.parse(frame.slice(6));

        if (evt.type === "thinking") {
          if (!thinkingBubble) {
            thinkingBubble = addMessage("thinking", "");
            status.textContent = "thinking…";
          }
          thinkingBubble.node.appendData(evt.text);
          log.scrollTop = log.scrollHeight;
        } else if (evt.type === "thinking_done") {
          thinkingBubble = null;  // a later tool hop starts a new one, kept visually separate
        } else if (evt.type === "tool") {
          addMessage("tool", `[tool] ${evt.text}`);
          status.textContent = "using a tool…";
        } else if (evt.type === "token") {
          if (!bubble) {
            bubble = addMessage("assistant", "");
            status.textContent = "replying…";
          }
          reply += evt.text;
          bubble.node.appendData(evt.text);
          savePartialAssistant(reply);
          log.scrollTop = log.scrollHeight;
        } else if (evt.type === "error") {
          throw new Error(evt.text);
        } else if (evt.type === "done") {
          finished = true;
        }
      }
    }

    if (!finished) throw new Error("Connection dropped before the reply finished.");
    history.push({ role: "assistant", content: reply });
    saveHistory();
    dot.classList.remove("off");
    status.textContent = "ready";
  } catch (err) {
    history.pop();                // drop the unanswered question so roles keep alternating
    saveHistory();
    if (thinkingBubble) thinkingBubble.div.remove();
    if (bubble) bubble.div.remove();  // and any half-written reply
    input.value = text;           // put it back so it can simply be resent
    addMessage("tool", "Error: " + err.message);
    dot.classList.add("off");
    status.textContent = "error";
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (text && !busy) send(text);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

uploadBtn.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  fileInput.value = "";
  if (file) uploadFile(file);
});
clearDocsBtn.addEventListener("click", clearDocs);
newChatBtn.addEventListener("click", resetChat);

loadState();
renderHistory();
renderDocs();
checkInstance();
</script>
</body>
</html>
