<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Terminal</title>
<style>
  :root {
    --bg: #0b0e0a;
    --panel: #10140f;
    --line: #1e2a1a;
    --amber: #ffb300;
    --green: #7ee787;
    --dim: #5c6b58;
    --text: #d9e3d0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--dim);
    letter-spacing: 0.02em;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.off { background: #5a2323; box-shadow: none; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px 8px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { margin-bottom: 18px; line-height: 1.55; white-space: pre-wrap; }
  .msg .role { color: var(--dim); font-size: 12px; display: block; margin-bottom: 4px; }
  .msg.user .role { color: var(--amber); }
  .msg.assistant .role { color: var(--green); }
  .msg.tool { color: var(--dim); font-size: 13px; border-left: 2px solid var(--line); padding-left: 10px; }
  form {
    display: flex;
    gap: 10px;
    padding: 14px 18px 20px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font: inherit;
    padding: 10px 12px;
    border-radius: 4px;
  }
  textarea:focus { outline: none; border-color: var(--amber); }
  button {
    background: var(--amber);
    color: #1a1200;
    border: none;
    padding: 0 18px;
    border-radius: 4px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<header><span class="dot" id="dot"></span><span id="status">ready</span></header>
<main id="log"></main>
<form id="form">
  <textarea id="input" rows="1" placeholder="Ask something…"></textarea>
  <button id="send">Send</button>
</form>
<script>
const API_KEY = localStorage.getItem("agent_api_key") || prompt("API key for this agent (leave blank if none set):") || "";
localStorage.setItem("agent_api_key", API_KEY);

const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const dot = document.getElementById("dot");
const status = document.getElementById("status");

let history = [];
let busy = false;

// Returns the message element and its text node, so a streaming reply can
// keep appending to the same node instead of re-rendering the message.
function addMessage(role, content) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  const label = document.createElement("span");
  label.className = "role";
  label.textContent = role;
  div.appendChild(label);
  const node = document.createTextNode(content);
  div.appendChild(node);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return { div, node };
}

async function send(text) {
  if (busy) return;               // never overlap requests: the server handles one at a time
  busy = true;
  history.push({ role: "user", content: text });
  addMessage("user", text);
  input.value = "";
  sendBtn.disabled = true;
  status.textContent = "thinking… (the first reply after a quiet spell can take a minute or two)";

  let bubble = null;              // assistant message, created when the first token arrives
  let reply = "";

  try {
    const res = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": API_KEY },
      body: JSON.stringify({ messages: history }),
    });
    if (!res.ok) {
      const body = await res.text();
      throw new Error(res.status === 429
        ? "The model is busy or still waking up. Wait a few seconds and resend."
        : res.status === 401 ? "Wrong password." : body);
    }

    // Server-sent events: frames look like `data: {...}` separated by a blank line.
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let finished = false;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let end;
      while ((end = buffer.indexOf("\n\n")) !== -1) {
        const frame = buffer.slice(0, end);
        buffer = buffer.slice(end + 2);
        if (!frame.startsWith("data: ")) continue;
        const evt = JSON.parse(frame.slice(6));

        if (evt.type === "tool") {
          addMessage("tool", `[tool] ${evt.text}`);
          status.textContent = "using a tool…";
        } else if (evt.type === "token") {
          if (!bubble) {
            bubble = addMessage("assistant", "");
            status.textContent = "replying…";
          }
          reply += evt.text;
          bubble.node.appendData(evt.text);
          log.scrollTop = log.scrollHeight;
        } else if (evt.type === "error") {
          throw new Error(evt.text);
        } else if (evt.type === "done") {
          finished = true;
        }
      }
    }

    if (!finished) throw new Error("Connection dropped before the reply finished.");
    history.push({ role: "assistant", content: reply });
    dot.classList.remove("off");
    status.textContent = "ready";
  } catch (err) {
    history.pop();                // drop the unanswered question so roles keep alternating
    if (bubble) bubble.div.remove();  // and any half-written reply
    input.value = text;           // put it back so it can simply be resent
    addMessage("tool", "Error: " + err.message);
    dot.classList.add("off");
    status.textContent = "error";
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (text && !busy) send(text);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});
</script>
</body>
</html>
